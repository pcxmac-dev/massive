<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Massive Charts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button id="symbolBtn" class="symbol" title="Change symbol (/)">Select symbol</button>
    <select id="feedSelect" title="Data feed"></select>
    <div id="periods" class="group" role="toolbar" aria-label="Interval"></div>
    <select id="typeSelect" title="Chart type">
      <optgroup label="Time based">
        <option value="bars">Bars</option>
        <option value="candles">Candles</option>
        <option value="hollow">Hollow candles</option>
        <option value="volume_candles">Volume candles</option>
        <option value="line">Line</option>
        <option value="line_markers">Line with markers</option>
        <option value="step">Step line</option>
        <option value="area">Area</option>
        <option value="hlc_area">HLC area</option>
        <option value="baseline">Baseline</option>
        <option value="columns">Columns</option>
        <option value="high_low">High-low</option>
        <option value="heikin_ashi">Heikin Ashi</option>
      </optgroup>
      <optgroup label="Price based">
        <option value="renko">Renko</option>
        <option value="line_break">Line break</option>
        <option value="kagi">Kagi</option>
        <option value="point_figure">Point &amp; figure</option>
        <option value="range">Range</option>
      </optgroup>
    </select>
    <span id="typeParams" class="params"></span>
    <select id="modelSelect" title="Model: the price, its derivatives, or its integral">
      <option value="price">Price</option>
      <option value="d1">1st derivative (slope)</option>
      <option value="d2">2nd derivative (acceleration)</option>
      <option value="integral">Integral (area)</option>
    </select>
    <span id="modelParams" class="params" hidden>
      <select id="modelBasis" title="Differentiate the price itself, or log price (percent terms)">
        <option value="price">price</option><option value="log">log %</option>
      </select>
      <label>per <select id="modelPer" title="Time unit of slopes and areas">
        <option value="bar">bar</option><option value="minute">minute</option>
        <option value="hour">hour</option><option value="day">day</option>
      </select></label>
      <label title="Detail: smooth (left) to full resolution (right)">smooth
        <input id="modelDetail" type="range" min="0" max="100" step="1">
      detail</label>
      <span id="modelWindow" class="p-muted"></span>
      <label title="Start fresh after overnight/weekend gaps so they never show as spikes">
        <input id="modelGaps" type="checkbox"> gaps</label>
    </span>
    <select id="adjustSelect" title="Continuous futures: back-adjust at contract rolls" hidden>
      <option value="none">Unadjusted (as traded)</option>
      <option value="difference">Back-adjusted (difference)</option>
      <option value="ratio">Back-adjusted (ratio)</option>
    </select>
    <button id="ethBtn" class="toggle" title="Extended hours: pre-market, after-hours and overnight">ETH</button>
    <div class="menu">
      <button id="indBtn" aria-haspopup="true">Indicators</button>
      <div id="indMenu" class="dropdown" hidden></div>
    </div>
    <span class="spacer"></span>
    <div class="menu layout-menu">
      <button id="layoutBtn" aria-haspopup="true" title="Layouts: saved markups">
        <span id="layoutName">Layout</span> <span id="layoutDirty" class="dirty" title="Unsaved changes" hidden>●</span> ▾
      </button>
      <div id="layoutMenu" class="dropdown right" hidden></div>
    </div>
    <button id="zoomOut" title="Zoom out (-)">&minus;</button>
    <button id="zoomIn" title="Zoom in (+)">+</button>
    <button id="latestBtn" title="Jump to latest bar (End)">Latest</button>
    <button id="panelBtn" class="toggle" title="Show / hide the info panel">Info</button>
    <button id="gpuBtn" class="toggle" title="GPU rendering (WebGL2 / OpenGL ES 3)">GPU</button>
    <button id="shotBtn" title="Save a PNG of the chart">PNG</button>
    <button id="themeBtn" title="Light / dark">Theme</button>
  </header>
  <main>
    <nav id="tools" aria-label="Drawing tools"></nav>
    <div id="chart"></div>
    <div id="panelResizer" role="separator" aria-orientation="vertical" aria-label="Resize info panel" tabindex="0"></div>
    <aside id="sidePanel" aria-label="Symbol information">
      <section id="pSymbol"></section>
      <section id="pHighlight"></section>
      <section id="pStats"></section>
      <section id="pBusiness"></section>
      <section id="pData"></section>
    </aside>
  </main>
  <footer id="status"><span id="statusText">Loading…</span><span id="error" role="alert"></span></footer>

  <dialog id="symbolDialog">
    <form method="dialog" class="dialog-head">
      <input id="symbolSearch" type="search" placeholder="Search ticker, name or exchange" autocomplete="off">
      <button value="close" aria-label="Close">&times;</button>
    </form>
    <div id="symbolList"></div>
  </dialog>

  <script src="vendor/klinecharts/klinecharts.min.js"></script>
  <script src="gpu.js"></script>
  <script src="app.js"></script>
</body>
</html>
