[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "massive-collate"
version = "0.1.0"
description = "Download, collate, analyse and chart stock market data from the Massive API (free and paid plans)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "plotly>=5.18",
    "tzdata>=2023.3",
    "exchange_calendars>=4.5",  # world exchange sessions, lunch breaks and holidays (Markets view)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
massive-collate = "massive_collate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
massive_collate = ["gui/static/*", "gui/static/vendor/klinecharts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
