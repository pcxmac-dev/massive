name: Fetch previous close

# Manual check that the MASSIVE_API_KEY secret works. Not scheduled: market data
# is collected on the local machine, and a scheduled job here would share the
# plan's request limit with the local sync.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Ticker symbol
        default: AAPL

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        env:
          # Set with: gh secret set MASSIVE_API_KEY -R pcxmac-dev/massive
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python fetch_prev_close.py "${{ inputs.ticker || 'AAPL' }}"
